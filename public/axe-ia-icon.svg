<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldIconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <linearGradient id="iconBoxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#23232b"/>
      <stop offset="100%" stop-color="#0a0a0d"/>
    </linearGradient>
  </defs>

  <!-- Box Icon Container with Border -->
  <rect x="5" y="5" width="110" height="110" rx="24" fill="url(#iconBoxGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Subtle Gold Corner Edge -->
  <rect x="5" y="5" width="110" height="110" rx="24" fill="none" stroke="url(#goldIconGrad)" stroke-width="2" stroke-dasharray="35 400"/>

  <!-- Monogram AX -->
  <text x="60" y="66" 
        font-family="'Cinzel', 'Times New Roman', serif" 
        font-size="44" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central">AX</text>

  <!-- Gold Bottom Accent -->
  <rect x="32" y="92" width="56" height="3" rx="1.5" fill="url(#goldIconGrad)"/>
</svg>
