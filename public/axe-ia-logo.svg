<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="100%" stop-color="#020204"/>
    </linearGradient>

    <!-- Gold Luxury Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Emblem Box Gradient -->
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26262e"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background (Transparent or Dark Luxury) -->
  <rect width="600" height="160" rx="16" fill="url(#bgGrad)" stroke="#26262e" stroke-width="1.5"/>

  <!-- Brand Emblem Box (AX Monogram) -->
  <g transform="translate(40, 35)">
    <!-- Box Container with Border -->
    <rect width="90" height="90" rx="18" fill="url(#emblemGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Subtle Gold Corner Accent -->
    <rect width="90" height="90" rx="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="25 350"/>

    <!-- Monogram Letters AX -->
    <text x="45" y="58" 
          font-family="'Cinzel', 'Times New Roman', serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="3" 
          fill="#ffffff" 
          text-anchor="middle" 
          dominant-baseline="central">AX</text>

    <!-- Gold Accent Line Underneath Emblem -->
    <rect x="20" y="76" width="50" height="2" rx="1" fill="url(#goldGrad)" opacity="0.85"/>
  </g>

  <!-- Typography Brand Name (AXÉ IA) -->
  <g transform="translate(150, 42)">
    <!-- AXÉ -->
    <text x="0" y="44" 
          font-family="'Syne', 'Montserrat', 'Inter', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="3.5" 
          fill="#ffffff">AXÉ</text>

    <!-- IA (in Gold) -->
    <text x="132" y="44" 
          font-family="'Syne', 'Montserrat', 'Inter', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="3.5" 
          fill="url(#goldGrad)" 
          filter="url(#glow)">IA</text>

    <!-- Live Emerald Pulse Dot -->
    <circle cx="216" cy="22" r="4.5" fill="#34d399"/>
    <circle cx="216" cy="22" r="8" fill="none" stroke="#34d399" stroke-width="1" opacity="0.5"/>

    <!-- Subtitle / Tagline -->
    <text x="3" y="74" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#94a3b8" 
          text-transform="uppercase">GLOBAL DIGITAL STUDIO</text>
  </g>
</svg>
