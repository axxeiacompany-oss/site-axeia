<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gold Luxury Gradient -->
    <linearGradient id="goldGradTransparent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>

    <!-- Emblem Box Gradient -->
    <linearGradient id="emblemGradTransparent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1f26"/>
      <stop offset="100%" stop-color="#0b0b0e"/>
    </linearGradient>
  </defs>

  <!-- Brand Emblem Box (AX Monogram) -->
  <g transform="translate(10, 15)">
    <!-- Box Container with Border -->
    <rect width="90" height="90" rx="18" fill="url(#emblemGradTransparent)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

    <!-- Monogram Letters AX -->
    <text x="45" y="56" 
          font-family="'Cinzel', 'Times New Roman', serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="3" 
          fill="#ffffff" 
          text-anchor="middle" 
          dominant-baseline="central">AX</text>

    <!-- Gold Accent Line Underneath Emblem -->
    <rect x="20" y="75" width="50" height="2" rx="1" fill="url(#goldGradTransparent)"/>
  </g>

  <!-- Typography Brand Name (AXÉ IA) -->
  <g transform="translate(125, 24)">
    <!-- AXÉ -->
    <text x="0" y="44" 
          font-family="'Syne', 'Montserrat', 'Inter', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="3.5" 
          fill="#ffffff">AXÉ</text>

    <!-- IA (in Gold) -->
    <text x="132" y="44" 
          font-family="'Syne', 'Montserrat', 'Inter', sans-serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="3.5" 
          fill="url(#goldGradTransparent)">IA</text>

    <!-- Live Emerald Pulse Dot -->
    <circle cx="214" cy="22" r="4.5" fill="#34d399"/>

    <!-- Subtitle / Tagline -->
    <text x="2" y="72" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="11.5" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#94a3b8" 
          text-transform="uppercase">GLOBAL DIGITAL STUDIO</text>
  </g>
</svg>
